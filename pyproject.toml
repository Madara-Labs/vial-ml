[project]
name = "vial-ml"
version = "0.1.4"
description = "Surgical code isolation for AI agents"
readme = "README.md"
authors = [
    { name = "Momchil Georgiev", email = "40865235+momchilgeorgiev@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.25.1",
    "tiktoken>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/Madara-Labs/vial-ml"
Repository = "https://github.com/Madara-Labs/vial-ml"
Issues = "https://github.com/Madara-Labs/vial-ml/issues"

[project.scripts]
vial = "vial.cli:app"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vial"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/vial"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
