<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vial — Surgical Code Isolation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --dim: #333333;
    --text: #f0f0f0;
    --muted: #555555;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene {
    width: 900px;
    height: 560px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 20px 0;
    border-bottom: 1px solid var(--dim);
    margin-bottom: 28px;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .tagline {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .step-indicator { display: flex; gap: 8px; align-items: center; }
  .step-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim);
    transition: background 0.4s;
  }
  .step-dot.active { background: var(--accent); }
  .step-dot.done   { background: var(--green); }

  .main {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    flex: 1;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    height: 380px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0d0d0d;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }

  .filename { margin-left: 4px; font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

  .panel-badge {
    margin-left: auto;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .badge-source   { background: #1a1a2e; color: #60a5fa;  border: 1px solid #1e3a5f; }
  .badge-isolated { background: #1a2e1a; color: var(--green); border: 1px solid #1e5f1e; }
  .badge-merged   { background: #1a1a1a; color: var(--accent); border: 1px solid #333300; }

  .code-area {
    padding: 14px 0;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .code-line {
    display: flex;
    align-items: center;
    padding: 1.5px 14px;
    font-size: 11px;
    line-height: 1.7;
    white-space: pre;
    position: relative;
  }

  .ln {
    color: var(--muted);
    min-width: 24px;
    margin-right: 12px;
    text-align: right;
    user-select: none;
    font-size: 10px;
  }

  .hl-target   { background: rgba(232,255,71,0.06);  border-left: 2px solid var(--accent); }
  .hl-context  { background: rgba(96,165,250,0.04);  border-left: 2px solid var(--blue); opacity: .6; }
  .hl-modified { background: rgba(74,222,128,0.07);  border-left: 2px solid var(--green); animation: flashG .6s ease; }
  .hl-dim      { opacity: .18; }

  @keyframes flashG {
    0%   { background: rgba(74,222,128,.3); }
    100% { background: rgba(74,222,128,.07); }
  }

  .scan-line {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 0; opacity: 0; pointer-events: none;
  }
  .scan-line.go { animation: scanAnim .8s ease forwards; }
  @keyframes scanAnim {
    0%  { top:0;   opacity:.9; }
    90% { top:90%; opacity:.9; }
    100%{ top:100%;opacity:0;  }
  }

  .arrow-col {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding-top: 40px;
  }

  .cmd-pill {
    background: #0d0d0d;
    border: 1px solid var(--dim);
    border-radius: 3px;
    padding: 5px 9px;
    font-size: 9px;
    color: var(--accent);
    text-align: center;
    white-space: pre;
    letter-spacing: .5px;
    opacity: 0;
    transform: translateY(4px);
    transition: all .4s ease;
    line-height: 1.6;
    max-width: 120px;
    word-break: break-all;
    white-space: normal;
  }
  .cmd-pill.show { opacity: 1; transform: translateY(0); }

  .arrow-shaft {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, var(--dim), var(--accent));
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform .5s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .arrow-shaft.show { transform: scaleX(1); }
  .arrow-shaft::after {
    content:'';
    position: absolute; right:-1px; top:-4px;
    border-left: 8px solid var(--accent);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
  }

  .arrow-lbl {
    font-size: 9px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
  }

  .check-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .4s;
    backdrop-filter: blur(2px);
  }
  .check-overlay.show { opacity: 1; }
  .check-circle {
    width:56px; height:56px; border-radius:50%;
    border: 2px solid var(--green);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:var(--green);
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    0%   { transform:scale(0); opacity:0; }
    100% { transform:scale(1); opacity:1; }
  }

  .phase-bar {
    margin-top: 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .phase-label {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: var(--text);
    min-width: 200px;
    transition: all .4s ease;
  }
  .phase-sub {
    font-size: 10px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
    flex: 1; transition: all .4s ease;
  }

  .token-counter {
    font-size: 10px; color: var(--muted);
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 4px;
  }
  .token-bar-wrap {
    width: 180px; height: 3px;
    background: var(--dim); border-radius: 2px; overflow: hidden;
  }
  .token-bar-fill {
    height: 100%; border-radius: 2px;
    background: var(--accent2);
    transition: width 1s cubic-bezier(.22,1,.36,1),
                background .6s ease;
  }
  .token-num { font-size: 11px; color: var(--accent2); margin-top: 3px; }

  body::before {
    content:''; position:fixed; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index:1000; opacity:.5;
  }

  .restart-btn {
    position: fixed; bottom:24px; right:24px;
    background: var(--dim); border: 1px solid #444;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size:10px; letter-spacing:2px;
    padding:8px 14px; cursor:pointer;
    text-transform:uppercase; border-radius:2px;
    transition: all .2s;
  }
  .restart-btn:hover { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>

<div class="scene">
  <div class="topbar">
    <div class="logo">vial</div>
    <div class="tagline">surgical code isolation for AI agents</div>
    <div class="step-indicator">
      <div class="step-dot" id="d0"></div>
      <div class="step-dot" id="d1"></div>
      <div class="step-dot" id="d2"></div>
    </div>
  </div>

  <div class="main">
    <!-- Left panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="filename" id="lname">billing.py</span>
        <span class="panel-badge badge-source" id="lbadge">SOURCE</span>
      </div>
      <div class="code-area" id="left">
        <div class="scan-line" id="sl-left"></div>
      </div>
    </div>

    <!-- Arrow column -->
    <div class="arrow-col">
      <div class="cmd-pill" id="pill">vial extract<br>billing.py<br>process_payment</div>
      <div class="arrow-shaft" id="arrow"></div>
      <div class="arrow-lbl" id="albl">extract</div>
    </div>

    <!-- Right panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="filename" id="rname">.vial_workspace/</span>
        <span class="panel-badge badge-isolated" id="rbadge">ISOLATED</span>
      </div>
      <div class="code-area" id="right">
        <div class="scan-line" id="sl-right"></div>
      </div>
      <div class="check-overlay" id="chk">
        <div class="check-circle">&#10003;</div>
      </div>
    </div>
  </div>

  <div class="phase-bar">
    <div class="phase-label" id="plabel">Extract</div>
    <div class="phase-sub"   id="psub">AST locates exact function boundaries</div>
    <div class="token-counter">
      <span style="letter-spacing:1px">TOKENS IN CONTEXT</span>
      <div class="token-bar-wrap">
        <div class="token-bar-fill" id="tbar" style="width:100%"></div>
      </div>
      <div class="token-num" id="tnum">~1,172 (full file)</div>
    </div>
  </div>
</div>

<button class="restart-btn" onclick="restart()">&#8635; replay</button>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const SRC = [
  {n:1,  t:'# billing.py',                         cm:true},
  {n:2,  t:'import json, hashlib',                  cm:true},
  {n:3,  t:'from pathlib import Path',              cm:true},
  {n:4,  t:''},
  {n:5,  t:'DATABASE_URL = "sqlite:///prod.db"'},
  {n:6,  t:'MAX_RETRIES = 3'},
  {n:7,  t:''},
  {n:8,  t:'def validate_card(number):'},
  {n:9,  t:'    return len(number) == 16'},
  {n:10, t:''},
  {n:11, t:'def process_payment(amount, card):',    tgt:true},
  {n:12, t:'    if not validate_card(card):',       tgt:true},
  {n:13, t:"        raise ValueError('invalid')",   tgt:true},
  {n:14, t:'    return {',                           tgt:true},
  {n:15, t:'        "status": "pending",',           tgt:true},
  {n:16, t:'        "amount": amount',               tgt:true},
  {n:17, t:'    }',                                  tgt:true},
  {n:18, t:''},
  {n:19, t:'def send_receipt(email, txn):'},
  {n:20, t:'    pass'},
  {n:21, t:''},
  {n:22, t:'class PaymentLogger:'},
  {n:23, t:'    def __init__(self, path):'},
  {n:24, t:'        self.path = path'},
];

const ISO = [
  {n:1,  t:'# Context (read-only):',              cm:true},
  {n:2,  t:'# import json, hashlib',              cm:true},
  {n:3,  t:'# DATABASE_URL = "sqlite:///prod.db"',cm:true},
  {n:4,  t:'# ========== END CONTEXT',            cm:true},
  {n:5,  t:''},
  {n:6,  t:'def process_payment(amount, card):'},
  {n:7,  t:'    if not validate_card(card):'},
  {n:8,  t:"        raise ValueError('invalid')"},
  {n:9,  t:'    return {'},
  {n:10, t:'        "status": "pending",'},
  {n:11, t:'        "amount": amount'},
  {n:12, t:'    }'},
];

const MOD = [
  {n:1,  t:'# Context (read-only):',              cm:true},
  {n:2,  t:'# import json, hashlib',              cm:true},
  {n:3,  t:'# DATABASE_URL = "sqlite:///prod.db"',cm:true},
  {n:4,  t:'# ========== END CONTEXT',            cm:true},
  {n:5,  t:''},
  {n:6,  t:'def process_payment(amount, card):'},
  {n:7,  t:'    if not validate_card(card):'},
  {n:8,  t:"        raise ValueError('invalid')"},
  {n:9,  t:'    return {'},
  {n:10, t:'        "status": "success",',         mod:true},
  {n:11, t:'        "amount": amount'},
  {n:12, t:'    }'},
];

const MERGED = [
  {n:1,  t:'# billing.py',                         cm:true},
  {n:2,  t:'import json, hashlib',                  cm:true},
  {n:3,  t:'from pathlib import Path',              cm:true},
  {n:4,  t:''},
  {n:5,  t:'DATABASE_URL = "sqlite:///prod.db"'},
  {n:6,  t:'MAX_RETRIES = 3'},
  {n:7,  t:''},
  {n:8,  t:'def validate_card(number):'},
  {n:9,  t:'    return len(number) == 16'},
  {n:10, t:''},
  {n:11, t:'def process_payment(amount, card):'},
  {n:12, t:'    if not validate_card(card):'},
  {n:13, t:"        raise ValueError('invalid')"},
  {n:14, t:'    return {'},
  {n:15, t:'        "status": "success",',          mod:true},
  {n:16, t:'        "amount": amount'},
  {n:17, t:'    }'},
  {n:18, t:''},
  {n:19, t:'def send_receipt(email, txn):'},
  {n:20, t:'    pass'},
  {n:21, t:''},
  {n:22, t:'class PaymentLogger:'},
];

// ── RENDER ────────────────────────────────────────────────────────────────
function color(t) {
  // Simple syntax highlighting via span wrapping on static strings
  const kwRe = /\b(def|class|return|if|raise|import|from|not)\b/g;
  const strRe = /(["'])([^"']*)\1/g;
  const numRe = /\b(\d+)\b/g;
  const cmRe  = /^(#.*)$/;

  if (cmRe.test(t)) return '<span style="color:var(--muted);font-style:italic">' + esc(t) + '</span>';

  let s = esc(t);
  s = s.replace(strRe, (_, q, inner) =>
    q + '<span style="color:#c3e88d">' + inner + '</span>' + q);
  s = s.replace(kwRe, '<span style="color:#c792ea">$1</span>');
  s = s.replace(numRe, '<span style="color:#f78c6c">$1</span>');
  return s;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTo(id, lines, delay) {
  const el = document.getElementById(id);
  // Clear keeping scan-line
  const sl = el.querySelector('.scan-line');
  el.textContent = '';
  if (sl) el.appendChild(sl);

  lines.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'code-line';
    if (l.tgt) row.classList.add('hl-target');
    if (l.cm)  row.classList.add('hl-context');
    if (l.mod) row.classList.add('hl-modified');

    const lnSpan = document.createElement('span');
    lnSpan.className = 'ln';
    lnSpan.textContent = l.n;
    row.appendChild(lnSpan);

    const code = document.createElement('span');
    // Safe: color() only manipulates static strings from our DATA array above
    code.innerHTML = color(l.t);
    row.appendChild(code);

    row.style.cssText = 'opacity:0;transform:translateX(-4px)';
    el.appendChild(row);

    setTimeout(() => {
      row.style.cssText = 'transition:all .25s ease';
    }, i * 28 + (delay || 0));
  });
}

function scan(id) {
  const el = document.getElementById(id);
  el.classList.remove('go');
  void el.offsetWidth;
  el.classList.add('go');
}

// ── UI HELPERS ────────────────────────────────────────────────────────────
function dots(active) {
  [0,1,2].forEach(i => {
    const d = document.getElementById('d' + i);
    d.className = 'step-dot' + (i < active ? ' done' : i === active ? ' active' : '');
  });
}
function phase(lbl, sub) {
  document.getElementById('plabel').textContent = lbl;
  document.getElementById('psub').textContent   = sub;
}
function tokens(pct, lbl) {
  const bar = document.getElementById('tbar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'var(--accent2)' : pct > 20 ? '#facc15' : 'var(--green)';
  document.getElementById('tnum').textContent = lbl;
}
function showArrow(label, pill) {
  document.getElementById('arrow').classList.add('show');
  document.getElementById('albl').textContent = label;
  document.getElementById('pill').textContent = pill;
  document.getElementById('pill').classList.add('show');
}
function hideArrow() {
  document.getElementById('arrow').classList.remove('show');
  document.getElementById('pill').classList.remove('show');
}

// ── PHASES ────────────────────────────────────────────────────────────────
let timer = null;
function after(ms, fn) { timer = setTimeout(fn, ms); }

function p0() {
  dots(0);
  phase('Extract', 'AST locates exact function boundaries');
  tokens(100, '~1,172 tokens  (full file)');
  hideArrow();

  document.getElementById('lname').textContent = 'billing.py';
  document.getElementById('lbadge').className  = 'panel-badge badge-source';
  document.getElementById('lbadge').textContent = 'SOURCE';
  document.getElementById('rname').textContent  = '.vial_workspace/';
  document.getElementById('rbadge').className   = 'panel-badge badge-isolated';
  document.getElementById('rbadge').textContent  = 'ISOLATED';
  document.getElementById('chk').classList.remove('show');
  document.getElementById('right').innerHTML     = '<div class="scan-line" id="sl-right"></div>';

  renderTo('left', SRC, 0);

  after(700,  () => document.getElementById('pill').classList.add('show'));
  after(900,  () => { document.getElementById('pill').textContent = 'vial extract\nbilling.py\nprocess_payment'; });
  after(1000, () => scan('sl-left'));
  after(1200, () => document.getElementById('arrow').classList.add('show'));
  after(1500, () => {
    document.getElementById('rname').textContent = 'process_payment_isolated.py';
    renderTo('right', ISO, 0);
    tokens(12, '~139 tokens  (isolated)');
  });

  after(5000, p1);
}

function p1() {
  dots(1);
  phase('Edit', 'Agent modifies only the isolated file');
  hideArrow();

  after(500, () => {
    renderTo('right', MOD, 0);
    scan('sl-right');
  });

  after(4000, p2);
}

function p2() {
  dots(2);
  phase('Merge', 'Syntax validated · spliced back precisely');

  document.getElementById('pill').textContent = 'vial merge';
  document.getElementById('pill').classList.add('show');
  document.getElementById('albl').textContent = 'merge';

  after(400, () => {
    document.getElementById('arrow').classList.add('show');
    document.getElementById('lname').textContent = 'billing.py';
    document.getElementById('lbadge').className  = 'panel-badge badge-merged';
    document.getElementById('lbadge').textContent = 'MERGED';
    scan('sl-left');
    after(300, () => { renderTo('left', MERGED, 0); tokens(100, '~1,172 tokens  (full file)'); });
    after(1100,() => document.getElementById('chk').classList.add('show'));
  });

  after(4500, p3);
}

function p3() {
  dots(3);
  phase('Done.', 'Surrounding code untouched  ·  token cost −88%');
  document.getElementById('chk').classList.remove('show');
  tokens(12, '~139 tokens used for the edit');
  renderTo('left', MERGED, 0);
  renderTo('right', MOD, 0);

  after(4500, p0);
}

function restart() {
  clearTimeout(timer);
  hideArrow();
  document.getElementById('chk').classList.remove('show');
  p0();
}

p0();
</script>
</body>
</html>
